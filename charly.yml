              id: https-arch-org
              stdout: {matches: "^(20[0-9]|30[0-9])"}
              context: [runtime]
              command: "curl -sfo /dev/null -w '%{http_code}' https://archlinux.org/"
            - check: dns=archlinux.org
              id: dns-check-operator-side
              context: [runtime]
              dns:
                dns: archlinux.org
                resolvable: true
            - check: addr=127.0.0.1:2224
              id: addr-ssh-reachable
              timeout: "5s"
              context: [runtime]
              addr:
                addr: "127.0.0.1:2224"
