              context: [runtime]
            - check: libvirt=guest/ping
              id: libvirt-guest-agent-ping
              libvirt: "guest/ping"
              stderr: {contains: responsive}
              context: [runtime]
            - check: libvirt=guest/hostname
              id: libvirt-guest-hostname
              libvirt: "guest/hostname"
              stdout: {matches: ".+"}
              context: [runtime]
            - check: libvirt=guest/os-info
              id: libvirt-guest-os-info
              libvirt: "guest/os-info"
              stdout: {contains: arch}
              context: [runtime]
            - check: libvirt=guest/interfaces
              id: libvirt-guest-interfaces
              libvirt: "guest/interfaces"
              stdout: {contains: lo}
              context: [runtime]
            - check: command=pacman-key --list-keys arch 2>&1 | grep -q pub
              id: pacman-key-populated
              context: [runtime]
              command: "pacman-key --list-keys arch 2>&1 | grep -q pub"
            - check: command=sudo pacman -Sy --noconfirm
              id: pacman-repos-reachable
              context: [runtime]
              command: "sudo pacman -Sy --noconfirm"
            - check: command=test -f /home/arch/.ssh/authorized_keys
              id: ssh-authorized-keys
              context: [runtime]
              command: "test -f /home/arch/.ssh/authorized_keys"
            - check: command=grep -c ssh-ed25519 /home/arch/.ssh/authorized_keys
              id: ssh-ed25519-key-count
