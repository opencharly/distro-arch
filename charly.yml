#  opencharly/distro-arch — the Arch Linux image family, split out of the main
#  opencharly repo (2026-05). Mounted as a git submodule at box/arch.
#
#  SINGLE-FILE config: every entity (the arch + arch-builder + cuda-arch-builder
#  base/builder stack, the arch-coder/charly-arch/arch-test/vscode-test images,
#  the arch-pacstrap-builder + arch-pacstrap bootstrap pair, the arch +
#  arch-pacstrap VMs, and the disposable check beds) is inlined here or discovered
#  under box/. This repo VENDORS NOTHING — every candy layer is an
#  `@github.com/opencharly/charly/candy/...` ref into the main repo. The arch
#  base/builder stack is LOCAL (this submodule owns it after the 2026-06 box
#  inversion), so NO namespace import is needed — every image's base is a bare
#  local `arch`, every multi-stage builder a bare local `arch-builder`.
#
#  Directly buildable: `charly box build arch-coder` (the build verb defaults to
#  this charly.yml). From the parent repo: `charly -C box/arch box build
#  arch-coder`, or anywhere: `charly --repo opencharly/distro-arch box build arch-coder`.
version: 2026.186.2323
# Canonical repo identity. Optional now that the main↔arch cycle dissolved (main
# imports this repo; this repo imports nothing back), but kept for self-import
# recognition when commands run from inside the submodule.
repo: github.com/opencharly/distro-arch
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
    merge:
        auto: false
        max_mb: 128
# No namespace import: the arch base/builder stack is local to this submodule;
# every candy layer resolves via its own `@github` ref into the main repo.
import: []
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
# Disposable R10 test beds for the arch VMs (kind:check — the 2026-05
# deploy→check unification moved repo-shipped disposable beds out of
# deploy.yml). disposable: true is the sole authorization for the
# unattended destroy+rebuild driven by `charly check run <bed>`. These are
# zero-side-effect beds (target: vm); there are NO operator deploy entries
# in this repo, so there is no deploy: section.
#
# Relocated from main (2026-06 box inversion) with its vscode-test box: the
# disposable R10 bed for the Arch vscode direct-download install path. Bare
# local `box: vscode-test` (the box now lives under box/ in this submodule).
check-arch-vscode-pod:
    pod:
        image: vscode-test
        disposable: true
        lifecycle: dev
        description: Sole proof of the Arch vscode install via the version-pinned, sha256-verified Microsoft direct-download that replaced the broken visual-studio-code-bin AUR package. Builds and deploys the vscode-test pod (arch base + check-keepalive supervisord + vscode), verifies /usr/bin/code and a code --version semver via the baked vscode plan, the supervisord keepalive RUNNING, and that charly status --json shows the running pod (status-shows-pod).
        plan:
            - check: command=charly status --json
              id: status-shows-vscode-pod
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-arch-vscode-pod
              context:
                - runtime
              command:
                command: charly status --json
                in_container: false
# =================================================================
# check-tmux-pod — R10 witness for the MAIN superproject's externalized `charly tmux`
# COMMAND (charly candy/plugin-tmux, command:tmux — the FIRST welded-command
# externalization, the precedent for preempt/feature/vm). It lives HERE in box/arch (not
# main) because it deploys a custom box (check-tmux-box, a sibling box/arch box = arch base
# + the tmux candy baked) and main owns no boxes. Running it FROM box/arch is also what makes
# it resolvable: the bed runner's selfSuperprojectOverridePair(box/arch) points the
# `@github` charly refs (check-tmux-box's candy/tmux) at the LOCAL main working tree — the
# SAME pattern check-arch-vscode-pod uses for candy/vscode, and box/fedora's
# check-fedora-coder-pod uses to test main's charly-mcp via the host charly.
# The HOST charly under test is the superproject build (the baked plugin-tmux from pkg/arch):
# the single host-side check drives the full `charly tmux` round-trip against the deployed pod —
#   - `charly tmux run`     creates a detached session (printing a RUN marker, then exec bash)
#   - `charly tmux list`    shows the session by name
#   - `charly tmux capture` returns the session's pane output (the RUN marker)
#   - `charly tmux send`    injects a command the live shell EXECUTES (arithmetic marker)
#   - `charly tmux capture` returns the EXECUTED output (TMUX-SEND-42)
#   - `charly tmux kill`    tears the session down
# proving the externalized plugin's `charly cmd`/`charly shell` shell-backs reach the pod's tmux
# (same container, exec user, /tmp/tmux-<uid> socket) identically to the former welded core path
# (resolveCheckVenue + DeployExecutor venueRun). The interactive shell/attach leaves (a real TTY
# via `charly shell -c`) cannot be driven non-interactively; they share the SAME shell-back
# design and are proven by the Go e2e (TestExternalCommandExecPlan_Tmux) + the design.
# =================================================================
check-tmux-pod:
    pod:
        image: check-tmux-box
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the MAIN superproject's externalized `charly tmux` COMMAND (charly candy/plugin-tmux, command:tmux), the FIRST welded-command externalization. A disposable pod running check-tmux-box (arch base + the tmux candy baked) whose host-side check drives the full `charly tmux` session round-trip against the pod via the HOST charly (the baked plugin-tmux under test): `run` creates a detached session, `list` shows it, `capture` returns its echoed output, `send` injects a command the live shell EXECUTES, a second `capture` returns the EXECUTED output, and `kill` tears it down — proving the plugin's `charly cmd`/`charly shell` shell-backs reach the pod's tmux (same container, exec user, and tmux socket) identically to the former welded core path (TMUX-ROUNDTRIP-OK).
        plan:
            - check: >-
                the externalized charly tmux drives a full session round-trip against the pod (run creates a detached session, list shows it, capture returns its echoed RUN marker, send injects a command whose EXECUTED output a second capture returns, kill removes it) — proving the charly cmd/charly shell shell-backs reach the pod's tmux
              id: tmux-roundtrip
              exit_status: 0
              stdout:
                - contains: TMUX-ROUNDTRIP-OK
              context:
                - runtime
              command:
                in_container: false
                command: |
                    set -e
                    charly tmux kill check-tmux-pod -s rdd >/dev/null 2>&1 || true
                    charly tmux run check-tmux-pod -s rdd 'echo TMUX-RUN-LIVE; exec bash --norc'
                    charly tmux list check-tmux-pod | grep -qE '^rdd:'
                    charly tmux capture check-tmux-pod -s rdd -n 200 | grep -q TMUX-RUN-LIVE
                    # send (text + Enter, no -l) injects a command the live shell EXECUTES — the
                    # arithmetic marker $((6*7))→42 only appears in the pane if the keys were
                    # delivered AND the shell ran the line (not merely typed it).
                    charly tmux send check-tmux-pod -s rdd 'echo TMUX-SEND-$((6*7))' --enter
                    charly tmux capture check-tmux-pod -s rdd -n 200 | grep -q 'TMUX-SEND-42'
                    charly tmux kill check-tmux-pod -s rdd
                    echo TMUX-ROUNDTRIP-OK
check-arch-pacstrap-vm:
    vm:
        from: arch-pacstrap
        disposable: true
        lifecycle: dev
        description: Sole proof that the from-scratch arch-pacstrap-builder bootstrap path produces a bootable UEFI Arch rootfs VM (distinct from the cachyos-pacstrap path). The privileged arch-pacstrap-builder pacstraps an Arch rootfs (sudo/openssh/qemu-guest-agent/cloud-init/grub/efibootmgr) into a 20G ext4 UEFI q35 disk and creates the libvirt VM, then asserts boot-to-steady-state via a libvirt info domain-state running probe and an SSH boot-witness reading the guest /etc/os-release.
        plan:
            - check: libvirt=info
              id: pacstrap-libvirt-domain-running
              libvirt: info
              stdout: {contains: running}
              context: [runtime]
            - check: command=cat /etc/os-release
              id: pacstrap-guest-os-release-arch
              stdout: {contains: "ID=arch"}
              context: [runtime]
              command: "cat /etc/os-release"
check-arch-vm:
    vm:
        from: arch
        disposable: true
        lifecycle: dev
        description: Sole runnable non-GPU bed for deterministic SPICE and the 8-method libvirt-RPC probe surface, and the only bed proving add_candy overlay install and nested local-target host deploys over the external vm deploy (kit.WalkPlans over SSH) and NestedExecutor. Boots the Arch cloud-image libvirt VM (SPICE socket + virtio-gpu + qemu-guest-agent), scps the host charly binary in, overlays ripgrep/uv/pre-commit, runs ~50 guest probes (command/package/service/port/process/user/group/interface/mount/dns/addr plus spice status/screenshot plus the 8 libvirt-RPC probes plus a kernel-param sysctl assertion), and drives two nested local-target beds (tailscale runtime wiring; direnv plus the install-ledger).
        # Minimal in-guest tooling so arch-host (child) has something
        # to depend on, and so the command: probes have ripgrep/uv/
        # pre-commit versions to verify. plugin-spice is the out-of-tree
        # host-side plugin serving the `spice:` check verb: the bed's spice
        # checks are authored INLINE in the plan with no candy in the image
        # closure requiring it, so it rides in here and the host check runner
        # loads it via the deploy's add_candy (ScanAllCandyWithConfigOpts'
        # ExtraCandyRefs) — the spice analogue of how plugin-kube/plugin-adb
        # are required by k3s-server/android-emulator-layer.
        add_candy:
            - '@github.com/opencharly/charly/candy/ripgrep:v2026.183.1359'
            - '@github.com/opencharly/charly/candy/uv:v2026.183.1359'
            - '@github.com/opencharly/charly/candy/pre-commit:v2026.183.1359'
            - '@github.com/opencharly/charly/candy/plugin-spice:v2026.183.1359'
        install_opts:
            with_service: true
            allow_repo_changes: true # pacman-key + mirror tweaks
            skip_incompatible: true # skip rpm:/deb:-only layer sections
            verify: true
            # The arch VM is a cloud image (no charly builder context); name the
            # arch-builder image so the npm-building add_candy (pre-commit)
            # resolves a builder. BundleNode has no `builder:` map field —
            # install_opts.builder_image is the supported path (mirrors cachyos).
            # Use the local short-ref (arch-builder), NOT a pinned ghcr tag: a
            # full ghcr ref is checked as-is and breaks when that tag is pruned /
            # ghcr publishing is paused (manifest unknown). The short-ref routes
            # through cfg.ResolveImage → newest local arch-builder, and builds it
            # on-demand if absent (same path arch-coder's builder: map uses).
            builder_image: arch-builder
        plan:
            - check: command=id
              id: guest-identity-uid
              stdout: {contains: "uid=1000(arch)"}
              context: [runtime]
              command: id
            - check: command=id
              id: guest-identity-wheel
              stdout: {contains: wheel}
              context: [runtime]
              command: id
            - check: command=cat /etc/hostname
              id: guest-hostname-nonempty
              stdout: {matches: ".+"}
              context: [runtime]
              command: "cat /etc/hostname"
            - check: command=cat /etc/os-release
              id: guest-os-release-arch
              stdout: {contains: "ID=arch"}
              context: [runtime]
              command: "cat /etc/os-release"
            - check: command=sudo -n whoami
              id: guest-sudo-nopasswd
              stdout: {equals: root}
              context: [runtime]
              command: "sudo -n whoami"
            - check: command=uname -r
              id: guest-kernel-release
              stdout: {matches: "[0-9]+\\.[0-9]+"}
              context: [runtime]
              command: "uname -r"
            - check: command=cloud-init status --wait --long
              id: cloud-init-status-done
              stdout: {contains: "status: done"}
              context: [runtime]
              command: "cloud-init status --wait --long"
            - check: command=test -d /var/lib/cloud/instance
              id: cloud-init-instance-dir
              context: [runtime]
              command: "test -d /var/lib/cloud/instance"
            - check: command=cat /var/lib/cloud/data/result.json
              id: cloud-init-no-errors
              stdout: {contains: "\"errors\": []"}
              context: [runtime]
              command: "cat /var/lib/cloud/data/result.json"
            - check: command=systemctl is-active spice-vdagentd
              id: spice-vdagentd-active
              stdout: {equals: active}
              context: [runtime]
              command: "systemctl is-active spice-vdagentd"
            - check: command=systemctl is-enabled spice-vdagentd
              id: spice-vdagentd-enabled
              stdout: {matches: "^(enabled|static)"}
              context: [runtime]
              command: "systemctl is-enabled spice-vdagentd"
            - check: command=lsmod | grep -q virtio_gpu
              id: virtio-gpu-module
              context: [runtime]
              command: "lsmod | grep -q virtio_gpu"
            - check: command=test -e /dev/dri/card0
              id: dri-card0-present
              context: [runtime]
              command: "test -e /dev/dri/card0"
            - check: spice=status
              id: spice-status-main
              spice: status
              stdout: {contains: display}
              context: [runtime]
            - check: spice=screenshot
              id: spice-framebuffer-nonzero
              spice:
                method: screenshot
                artifact: /tmp/check-arch-vm-spice.png
                artifact_min_bytes: 1024
              context:
                - runtime
            - check: libvirt=info
              id: libvirt-domain-running
              libvirt: info
              stdout: {contains: running}
              context: [runtime]
            - check: libvirt=domain-xml
              id: libvirt-domain-xml-q35
              libvirt: "domain-xml"
              stdout: {contains: q35}
              context: [runtime]
            - check: libvirt=domain-xml
              id: libvirt-domain-xml-virtio
              libvirt: "domain-xml"
              stdout: {contains: "type='virtio'"}
              context: [runtime]
            - check: libvirt=qmp
              id: libvirt-qmp-query-status
              libvirt:
                method: qmp
                text: query-status
              stdout: {contains: running}
              context: [runtime]
            - check: libvirt=guest/ping
              id: libvirt-guest-agent-ping
              libvirt: "guest/ping"
              stderr: {contains: responsive}
              context: [runtime]
            - check: libvirt=guest/hostname
              id: libvirt-guest-hostname
              libvirt: "guest/hostname"
              stdout: {matches: ".+"}
              context: [runtime]
            - check: libvirt=guest/os-info
              id: libvirt-guest-os-info
              libvirt: "guest/os-info"
              stdout: {contains: arch}
              context: [runtime]
            - check: libvirt=guest/interfaces
              id: libvirt-guest-interfaces
              libvirt: "guest/interfaces"
              stdout: {contains: lo}
              context: [runtime]
            - check: command=pacman-key --list-keys arch 2>&1 | grep -q pub
              id: pacman-key-populated
              context: [runtime]
              command: "pacman-key --list-keys arch 2>&1 | grep -q pub"
            - check: command=sudo pacman -Sy --noconfirm
              id: pacman-repos-reachable
              context: [runtime]
              command: "sudo pacman -Sy --noconfirm"
            - check: command=test -f /home/arch/.ssh/authorized_keys
              id: ssh-authorized-keys
              context: [runtime]
              command: "test -f /home/arch/.ssh/authorized_keys"
            - check: command=grep -c ssh-ed25519 /home/arch/.ssh/authorized_keys
              id: ssh-ed25519-key-count
              stdout: {matches: "[1-9]"}
              context: [runtime]
              command: "grep -c ssh-ed25519 /home/arch/.ssh/authorized_keys"
            - check: command=nproc
              id: cpu-count-4
              stdout: {matches: "^4"}
              context: [runtime]
              command: nproc
            - check: command=awk '/MemTotal/ {print int($2/1024/1024)}' /proc/meminfo
              id: mem-8g-ballpark
              stdout: {matches: "^[78]"}
              context: [runtime]
              command: "awk '/MemTotal/ {print int($2/1024/1024)}' /proc/meminfo"
            - check: command=df -BG / | awk 'NR==2 {gsub("G","",$2); print int($2)}'
              id: disk-ballpark
              stdout: {matches: "^([1-9][0-9]|[1-9][0-9][0-9])"}
              context: [runtime]
              command: "df -BG / | awk 'NR==2 {gsub(\"G\",\"\",$2); print int($2)}'"
            - check: command=rg --version
              id: ripgrep-version
              stdout: {contains: ripgrep}
              context: [runtime]
              command: "rg --version"
            - check: command=uv --version
              id: uv-version
              stdout: {contains: "uv "}
              context: [runtime]
              command: "uv --version"
            - check: command=pre-commit --version
              id: pre-commit-version
              stdout: {contains: pre-commit}
              context: [runtime]
              command: "pre-commit --version"
            - check: command=command -v rg uv pre-commit
              id: tooling-on-path
              context: [runtime]
              command: "command -v rg uv pre-commit"
            - check: package=base-devel
              id: pkg-base-devel-present
              context: [runtime]
              package:
                package: base-devel
                installed: true
            - check: package=git
              id: pkg-git-present
              context: [runtime]
              package:
                package: git
                installed: true
            - check: service=spice-vdagentd
              id: svc-spice-vdagentd-running
              context: [runtime]
              service:
                service: spice-vdagentd
                running: true
            - check: service=sshd
              id: svc-sshd-running
              context: [runtime]
              service:
                service: sshd
                running: true
            - check: port=22
              id: port-22-listening
              context: [runtime]
              port:
                port: 22
                listening: true
            - check: process=sshd
              id: proc-sshd-running
              context: [runtime]
              process:
                process: sshd
                running: true
            - check: user=arch
              id: user-arch-present
              context: [runtime]
              user:
                user: arch
                uid: 1000
            - check: group=wheel
              id: group-wheel-present
              context: [runtime]
              unix_group: wheel
            - check: interface=lo
              id: iface-lo-up
              context: [runtime]
              interface:
                interface: lo
                mtu: 65536
            - check: mount=/
              id: mount-root-mounted
              context: [runtime]
              mount: /
            - check: kernel-param=kernel.ostype
              id: kernel-ostype-linux
              context: [runtime]
              kernel-param:
                kernel-param: kernel.ostype
                value: Linux
            - check: command=getent hosts archlinux.org
              id: dns-arch-org
              context: [runtime]
              command: "getent hosts archlinux.org"
            - check: command=curl -sfo /dev/null -w '%{http_code}' https://archlinux.org/
              id: https-arch-org
              stdout: {matches: "^(20[0-9]|30[0-9])"}
              context: [runtime]
              command: "curl -sfo /dev/null -w '%{http_code}' https://archlinux.org/"
            - check: dns=archlinux.org
              id: dns-check-operator-side
              context: [runtime]
              dns:
                dns: archlinux.org
                resolvable: true
            - check: addr=127.0.0.1:2224
              id: addr-ssh-reachable
              timeout: "5s"
              context: [runtime]
              addr:
                addr: "127.0.0.1:2224"
                reachable: true
            - check: the matching verb smoke-test resolves the arch literal
              id: matching-smoke
              matching: {matching: "arch", contains: {equals: "arch"}}
              context: [runtime]
    charly-cachyos-tailscale-test:
        local:
            disposable: true
            lifecycle: dev
            description: R10 bed for tailscale + tailscale-up runtime wiring
            add_candy:
                - '@github.com/opencharly/charly/candy/tailscale:v2026.183.1359'
                - '@github.com/opencharly/charly/candy/tailscale-up:v2026.183.1359'
            install_opts:
                with_service: true
                allow_root_tasks: true
            plan:
                - check: command=test -x /usr/bin/tailscale && test -x /usr/sbin/tailscaled
                  id: tt-tailscale-binary
                  context: [runtime]
                  command: "test -x /usr/bin/tailscale && test -x /usr/sbin/tailscaled"
                - check: command=systemctl is-active tailscaled
                  id: tt-tailscaled-active
                  stdout: {equals: active}
                  context: [runtime]
                  command: "systemctl is-active tailscaled"
                - check: command=systemctl is-enabled tailscaled.service
                  id: tt-tailscaled-enabled
                  stdout: {matches: "^enabled"}
                  context: [runtime]
                  command: "systemctl is-enabled tailscaled.service"
    arch-host:
        local:
            disposable: true
            lifecycle: dev
            add_candy:
                - '@github.com/opencharly/charly/candy/direnv:v2026.183.1359'
            plan:
                - check: command=test -n "$(ls -A ~/.config/opencharly/installed/deploys/ 2>/dev/null)"
                  id: ah-deploy-recorded
                  context: [runtime]
                  command: "test -n \"$(ls -A ~/.config/opencharly/installed/deploys/ 2>/dev/null)\""
                - check: command=direnv --version
                  id: ah-direnv-version
                  context: [runtime]
                  command: "direnv --version"
                - check: command=test -d /home/arch/.config/opencharly/installed/deploys
                  id: ah-ledger-deploys-dir
                  context: [runtime]
                  command: "test -d /home/arch/.config/opencharly/installed/deploys"
                - check: command=test -d /home/arch/.config/opencharly/installed/layers
                  id: ah-ledger-layers-dir
                  context: [runtime]
                  command: "test -d /home/arch/.config/opencharly/installed/layers"
                - check: package=direnv
                  id: ah-direnv-installed
                  context: [runtime]
                  package:
                    package: direnv
                    installed: true
                - check: command=ss -tlnp 2>/dev/null | wc -l
                  id: ah-no-listeners
                  stdout: {matches: "^[0-9]+"}
                  context: [runtime]
                  command: "ss -tlnp 2>/dev/null | wc -l"
                - check: the matching verb confirms arch-host appears in the rendered list
                  id: ah-matching-list
                  matching: {matching: "arch-host in list", contains: {contains: "arch"}}
                  context: [runtime]
arch-pacstrap:
    vm:
        # `backend: libvirt` is REQUIRED — the check-arch-pacstrap-vm bed's
        # libvirt: probes RPC the daemon for THIS domain; `backend: auto`
        # silently falls back to qemu under load (daemon busy/slow), creating
        # the domain outside libvirt and failing every libvirt-RPC probe with
        # "Domain not found" (the sibling `arch` entity documents the same
        # failure mode).
        backend: libvirt
        source:
            kind: bootstrap
            builder: pacstrap
            # builder_image is the LOCAL arch-pacstrap-builder image (defined in
            # this repo's image: block), so it stays a bare local name.
            builder_image: arch-pacstrap-builder
            distro: arch
            package:
                - sudo
                - openssh
                - qemu-guest-agent
                - cloud-init
                - grub
                - efibootmgr
            rootfs: ext4
            kernel_args: console=tty0 console=ttyS0,115200
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: uefi-insecure
        network:
            mode: user
        ssh:
            user: arch
            port_auto: true
            key_source: generate
        cloud_init:
            users:
                - name: arch
                  sudo: true
                  shell: /bin/bash
            runcmd:
                - systemctl enable --now sshd
                - systemctl enable --now qemu-guest-agent
                # Diagnostic: write network + sshd state to /boot so it can
                # be mount-inspected after a failed-boot cycle.
                - "{ ip a; echo ===listen===; ss -tlnp; echo ===sshd===; systemctl status sshd --no-pager; } > /boot/charly-diag.txt 2>&1"
arch:
    vm:
        source:
            kind: cloud_image
            url: https://fastly.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
            checksum:
                type: sha256
            base_user: arch
        # Disposability is NOT a VmSpec field (the schema-v3 cutover removed
        # VmSpec.Disposable / VmSpec.Lifecycle). The load-bearing copy lives on
        # the check.check-arch-vm bed below (`disposable: true` authorizes the
        # unattended destroy+rebuild). See /charly-internals:disposable.
        #
        # `backend: libvirt` is REQUIRED — the check-arch-vm bed's check list
        # contains 8 `charly check libvirt …` probes + 2 `charly check spice …`
        # probes that all hit the libvirt user-session daemon socket.
        # With `backend: auto` and the daemon NOT running on the
        # operator's machine, resolveVmBackend silently falls through
        # to direct-qemu and every libvirt-RPC probe fails with
        # "no such file or directory". Explicit `backend: libvirt`
        # makes resolveVmBackend fail loudly with a `systemctl --user
        # enable --now virtqemud.service` hint instead. See
        # /charly-vm:vm "Backend matrix" for the prereq.
        backend: libvirt
        disk_size: 40G
        ram: 8G
        cpu: 4
        machine: q35
        firmware: bios
        network:
            mode: user
        ssh:
            port: 2224
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                # The host's charly binary (the one PKGBUILD builds) is
                # cgo-free for SPICE audio: the SPICE audio channels (the
                # sole opus/portaudio cgo consumers) were dep-shed out of
                # core into the out-of-tree `candy/plugin-spice`, gated
                # behind `-tags spice_audio`. `ldd $(command -v charly)`
                # shows no libportaudio/libopus, so under
                # `charly_install.strategy: auto` the scp'd host binary
                # runs in the guest with NO portaudio/opusfile installed.
                # Only a host/guest that opts into the `spice_audio`
                # plugin-spice build needs them — not the default toolchain.
                #
                # `base-devel` and `git` are required by the bed's
                # `package:` check probes (the check-arch-vm check list).
                # They were dropped in error during the runcmd cleanup
                # of the 2026-05 R10 follow-up; re-added 2026-05-06.
                - sudo
                - spice-vdagent
                - qemu-guest-agent
                - base-devel
                - git
            runcmd:
                # Activate the desktop / agent units that came in with
                # cloud_init.packages. The legacy charly-from-source build
                # block (git clone + makepkg + pacman -U) was DELETED
                # in the 2026-05 R10 follow-up: it was redundant with
                # `charly_install.strategy: auto` (which scps the host
                # binary post-boot via the vm deploy's PrepareVenue/EnsureCharlyInGuest) AND timed out
                # under load — leaving non-empty errors[] in
                # /var/lib/cloud/data/result.json that broke the
                # `cloud-init no-errors` check probe.
                #
                # `pacman-key --init && --populate archlinux` is
                # required for post-boot pacman invocations driven
                # by `charly bundle add check-arch-vm <ref>` (layer install via
                # SSH). Without it, `pacman -Sy <pkg>` fails with
                # `keyring is not writable / required key missing`.
                # Cloud-init's own `packages:` step is unaffected
                # (cloud-init bootstraps its own keyring); only the
                # later operator-driven pacman calls need this.
                - pacman-key --init
                - pacman-key --populate archlinux
                - systemctl enable --now spice-vdagentd
                - systemctl enable --now qemu-guest-agent
            charly_install:
                # `auto` scps the host's charly binary into the guest
                # after cloud-init reaches steady-state. Sole install
                # path; no defence-in-depth runcmd fallback (it could
                # not consume the scp's failure signal anyway because
                # cloud-init runs before the vm deploy walk fires).
                strategy: auto
        libvirt:
            devices:
                channels:
                    - type: spicevmc
                      name: com.redhat.spice.0
                graphics:
                    - type: spice
                      listen:
                        - type: socket
                video:
                    - model: virtio
                      vram: 65536
                      heads: 1
                      accel3d: false
                rng:
                    - model: virtio
                      backend: /dev/urandom
                memballoon:
                    model: virtio
            snippets:
                - "<channel type='unix'><target type='virtio' name='org.qemu.guest_agent.0'/></channel>"
