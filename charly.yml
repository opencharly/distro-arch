#  opencharly/distro-arch — the Arch Linux image family, split out of the main
#  opencharly repo (2026-05). Mounted as a git submodule at box/arch.
#
#  SINGLE-FILE config: every entity (the arch + arch-builder + cuda-arch-builder
#  base/builder stack, the arch-coder/charly-arch/arch-test/vscode-test images,
#  the arch-pacstrap-builder + arch-pacstrap bootstrap pair, the arch +
#  arch-pacstrap VMs, and the disposable check beds) is inlined here or discovered
#  under box/. This repo VENDORS NOTHING — every candy layer is an
#  `@github.com/opencharly/charly/candy/...` ref into the main repo. The arch
#  base/builder stack is LOCAL (this submodule owns it after the 2026-06 box
#  inversion), so NO namespace import is needed — every image's base is a bare
#  local `arch`, every multi-stage builder a bare local `arch-builder`.
#
#  Directly buildable: `charly box build arch-coder` (the build verb defaults to
#  this charly.yml). From the parent repo: `charly -C box/arch box build
#  arch-coder`, or anywhere: `charly --repo opencharly/distro-arch box build arch-coder`.
version: 2026.223.1018
# Canonical repo identity. Optional now that the main↔arch cycle dissolved (main
# imports this repo; this repo imports nothing back), but kept for self-import
# recognition when commands run from inside the submodule.
repo: github.com/opencharly/distro-arch
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
    merge:
        auto: false
        max_mb: 128
# No namespace import: the arch base/builder stack is local to this submodule;
# every candy layer resolves via its own `@github` ref into the main repo.
import: []
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
# Disposable R10 test beds for the arch VMs (kind:check — the 2026-05
# deploy→check unification moved repo-shipped disposable beds out of
# deploy.yml). disposable: true is the sole authorization for the
# unattended destroy+rebuild driven by `charly check run <bed>`. These are
# zero-side-effect beds (target: vm); there are NO operator deploy entries
# in this repo, so there is no deploy: section.
#
# Relocated from main (2026-06 box inversion) with its vscode-test box: the
# disposable R10 bed for the Arch vscode direct-download install path. Bare
# local `box: vscode-test` (the box now lives under box/ in this submodule).
check-arch-vscode-pod:
    pod:
        image: vscode-test
        disposable: true
        lifecycle: dev
        description: Sole proof of the Arch vscode install via the version-pinned, sha256-verified Microsoft direct-download that replaced the broken visual-studio-code-bin AUR package. Builds and deploys the vscode-test pod (arch base + check-keepalive supervisord + vscode), verifies /usr/bin/code and a code --version semver via the baked vscode plan, the supervisord keepalive RUNNING, and that charly status --json shows the running pod (status-shows-pod).
        plan:
            - check: command=charly status --json
              id: status-shows-vscode-pod
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-arch-vscode-pod
              context:
                - runtime
              command:
                command: charly status --json
                in_container: false
# =================================================================
# check-tmux-pod — R10 witness for terminal:tmux over the generic bidirectional
# Provider.Channel. The host places the fixed gRPC stdio endpoint inside this disposable
# pod, launches a typed profile, detaches on the provider's running event, reattaches for a
# structured snapshot, injects literal text + an allowlisted Enter key, waits for the pane's
# real zero exit, reads durable transcript evidence, and proves normal completion removed the
# isolated run-owned tmux server. No recursive command execution, capture-pane polling,
# fixed sleep, retry, or combination-specific container path participates.
# =================================================================
check-tmux-pod:
    pod:
        image: check-tmux-box
        disposable: true
        lifecycle: dev
        description: >-
            Disposable live proof of the generic typed terminal:tmux channel placed inside a pod through gRPC stdio. It verifies shorthand target resolution, launch/detach, structured resynchronization, literal input, an allowlisted key, streamed output, durable transcript evidence, real pane exit status, isolated socket naming, the typed-provider `charly tmux` compatibility facade, and verified normal cleanup through the same API used by local, SSH, nested, MCP, and TUI controllers (TMUX-ROUNDTRIP-OK). Host-side plan steps decode JSON transcript evidence with `node`, which must be installed on the bed-runner host (no `charly` verb filters transcript evidence).
        plan:
            - check: >-
                the typed terminal provider completes a detached pod round-trip and removes its run-owned tmux server after preserving ordered evidence
              id: tmux-roundtrip
              exit_status: 0
              stdout:
                - contains: TMUX-ROUNDTRIP-OK
              context:
                - runtime
              command:
                in_container: false
                command: |
                    set -eu
                    DIR=$(mktemp -d)
                    LOG="$DIR/commands.log"
                    STAGE=setup
                    finish_tmux_roundtrip() {
                      code=$?
                      if [ "$code" -ne 0 ]; then
                        echo "tmux-roundtrip: FAIL stage=$STAGE exit=$code" >&2
                        if [ -s "$LOG" ]; then
                          echo "tmux-roundtrip: command log follows" >&2
                          grep -E 'charly: error|agent channel: FAIL|incident|failed|not found|already exists' "$LOG" | tail -6 >&2 || tail -8 "$LOG" >&2
                        fi
                      fi
                      rm -rf "$DIR"
                      exit "$code"
                    }
                    trap finish_tmux_roundtrip EXIT
                    stage() {
                      STAGE=$1
                      echo "tmux-roundtrip: START $STAGE"
                    }
                    passed() {
                      echo "tmux-roundtrip: PASS $STAGE"
                    }
                    export CHARLY_AGENT_STATE_DIR="$DIR/state"
                    RUN=0198f140-6b7a-7b90-8a10-aabbccddeeff
                    SOCKET=charly-0198f1406b7a7b908a10aabbccddeeff
                    PROFILE='{"name":"r10-shell","entrypoint":["sh"],"cols":80,"rows":24,"keys":["enter"],"persistence":"detach","transcript":"both"}'
                    TARGET=check-tmux-pod
                    stage minimal-target-precondition
                    if ${CHARLY_BIN} cmd check-tmux-pod 'command -v charly' 2>>"$LOG"; then
                      echo 'minimal bootstrap target unexpectedly has Charly on PATH' >&2
                      exit 1
                    fi
                    passed
                    stage deployment-grpc-tmux
                    ${CHARLY_BIN} agent terminal launch "$PROFILE" --target "$TARGET" --run-id "$RUN" 2>>"$LOG" | grep -q '"state":"detached"'
                    ${CHARLY_BIN} agent terminal snapshot "$PROFILE" --target "$TARGET" --run-id "$RUN" 2>>"$LOG" | grep -q '"cols":80'
                    ${CHARLY_BIN} agent terminal input "$PROFILE" 'echo TMUX-SEND-42; exit 0' --target "$TARGET" --run-id "$RUN" 2>>"$LOG"
                    ${CHARLY_BIN} agent terminal key "$PROFILE" enter --target "$TARGET" --run-id "$RUN" 2>>"$LOG"
                    ${CHARLY_BIN} agent terminal run "$PROFILE" --target "$TARGET" --run-id "$RUN" 2>>"$LOG"
                    ${CHARLY_BIN} agent terminal transcript "$RUN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const text=JSON.parse(s).map(f=>(f.data?Buffer.from(f.data,"base64").toString():"")+(f.snapshot||"")).join("\n");if(!text.includes("TMUX-SEND-42"))process.exit(1)})'
                    if ${CHARLY_BIN} cmd check-tmux-pod "tmux -L $SOCKET has-session -t run" 2>>"$LOG"; then
                      echo "run-owned tmux server survived normal completion" >&2
                      exit 1
                    fi
                    passed
                    stage tmux-compatibility-launch
                    ${CHARLY_BIN} tmux run check-tmux-pod sh --session compatibility >/dev/null 2>>"$LOG"
                    passed
                    stage tmux-compatibility-list
                    ${CHARLY_BIN} tmux list check-tmux-pod | grep -q '"tmux_compat_session":"compatibility"'
                    passed
                    stage tmux-compatibility-command
                    ${CHARLY_BIN} tmux cmd check-tmux-pod 'printf TYPED-TMUX-COMPAT-OK' --session compatibility --no-notify >/dev/null 2>>"$LOG"
                    passed
                    stage tmux-compatibility-capture
                    ${CHARLY_BIN} tmux capture check-tmux-pod --session compatibility 2>>"$LOG" | grep -q TYPED-TMUX-COMPAT-OK
                    passed
                    stage tmux-compatibility-kill
                    ${CHARLY_BIN} tmux kill check-tmux-pod --session compatibility >/dev/null 2>>"$LOG"
                    passed

                    # Prepare one ephemeral SSH identity using Charly's deployment
                    # commands, then prove both direct SSH and recursively nested
                    # deployment→SSH use the same generic bootstrap + gRPC + tmux path.
                    stage ssh-identity-setup
                    ${CHARLY_BIN} cmd check-tmux-pod "rm -f /tmp/r10_id /tmp/r10_id.pub; ssh-keygen -q -N '' -t ed25519 -f /tmp/r10_id; mkdir -p \"\$HOME/.ssh\"; cat /tmp/r10_id.pub > \"\$HOME/.ssh/authorized_keys\"; chmod 700 \"\$HOME/.ssh\"; chmod 600 \"\$HOME/.ssh/authorized_keys\"" 2>>"$LOG"
                    ${CHARLY_BIN} cp check-tmux-pod :/tmp/r10_id "$DIR/id_ed25519" 2>>"$LOG"
                    chmod 0600 "$DIR/id_ed25519"
                    passed
                    stage ssh-grpc-tmux
                    SSH_PROFILE='{"name":"ssh-bootstrap-shell","entrypoint":["sh","-c","printf SSH-BOOTSTRAP-GRPC-TMUX-OK; exit 0"],"cols":80,"rows":24,"persistence":"none","transcript":"both"}'
                    SSH_TARGET='{"hops":[{"transport":"ssh","address":"127.0.0.1","user":"user","port":${HOST_PORT:2222},"identity_file":"'$DIR'/id_ed25519","options":{"IdentitiesOnly":"yes","LogLevel":"ERROR","StrictHostKeyChecking":"no","UserKnownHostsFile":"/dev/null"}},{"transport":"grpc"},{"transport":"tmux"}]}'
                    SSH_RUN=0198f140-6b7a-7b90-8a10-aabbccddee01
                    SSH_OUT="$DIR/ssh-grpc-tmux.jsonl"
                    ${CHARLY_BIN} agent terminal run "$SSH_PROFILE" --target "$SSH_TARGET" --run-id "$SSH_RUN" >"$SSH_OUT" 2>>"$LOG"
                    cat "$SSH_OUT" >>"$LOG"
                    if ! grep -q '"kind":"exit"' "$SSH_OUT"; then
                      echo 'tmux-roundtrip: ssh-grpc-tmux returned without an exit frame' >&2
                      exit 1
                    fi
                    ${CHARLY_BIN} agent terminal transcript "$SSH_RUN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const text=JSON.parse(s).map(f=>(f.data?Buffer.from(f.data,"base64").toString():"")+(f.snapshot||"")).join("\n");if(!text.includes("SSH-BOOTSTRAP-GRPC-TMUX-OK"))process.exit(1)})'
                    passed
                    stage deployment-ssh-grpc-tmux
                    NESTED_PROFILE='{"name":"nested-bootstrap-shell","entrypoint":["sh","-c","printf NESTED-DEPLOYMENT-SSH-GRPC-TMUX-OK; exit 0"],"cols":80,"rows":24,"persistence":"none","transcript":"both"}'
                    NESTED_TARGET='{"deployment":"check-tmux-pod","hops":[{"transport":"ssh","address":"127.0.0.1","user":"user","port":2222,"identity_file":"/tmp/r10_id","options":{"IdentitiesOnly":"yes","LogLevel":"ERROR","StrictHostKeyChecking":"no","UserKnownHostsFile":"/dev/null"}},{"transport":"grpc"},{"transport":"tmux"}]}'
                    NESTED_RUN=0198f140-6b7a-7b90-8a10-aabbccddee02
                    NESTED_OUT="$DIR/deployment-ssh-grpc-tmux.jsonl"
                    ${CHARLY_BIN} agent terminal run "$NESTED_PROFILE" --target "$NESTED_TARGET" --run-id "$NESTED_RUN" >"$NESTED_OUT" 2>>"$LOG"
                    cat "$NESTED_OUT" >>"$LOG"
                    if ! grep -q '"kind":"exit"' "$NESTED_OUT"; then
                      echo 'tmux-roundtrip: deployment-ssh-grpc-tmux returned without an exit frame' >&2
                      exit 1
                    fi
                    ${CHARLY_BIN} agent terminal transcript "$NESTED_RUN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const text=JSON.parse(s).map(f=>(f.data?Buffer.from(f.data,"base64").toString():"")+(f.snapshot||"")).join("\n");if(!text.includes("NESTED-DEPLOYMENT-SSH-GRPC-TMUX-OK"))process.exit(1)})'
                    passed
                    STAGE=complete
                    echo TMUX-ROUNDTRIP-OK
# =================================================================
# check-agent-pod — complete disposable proof of the generic agent control
# plane. One image exercises native Pi persistence, the official orchestrator
# CLI delegation seam, Pi-TUI, OCI capability discovery, deployment→gRPC→tmux,
# real OpenSSH→gRPC→tmux, candybox→SSH federation, and a credential-synced real
# Claude Code terminal run. Every route uses the same CUE #TargetSpec and
# Provider.Channel API; the setup contains no transport-pair implementation.
# =================================================================
check-agent-pod:
    pod:
        image: check-agent-box
        disposable: true
        lifecycle: dev
        description: >-
            Full R10 witness for the CUE-generated agent control plane and its generic target cross-product. It proves native Pi survives a two-process resume with no resident runner, exact delegation to the official Pi orchestrator rpc-stream CLI, the actual Pi-TUI client, baked agent/terminal OCI labels, deployment and nested tmux over gRPC, real gRPC over an auto-ported OpenSSH target, candybox-to-node federation, ordered durable transcripts, run-owned cleanup, and a credential-synced real Claude Code prompt through the same typed API. Host-side plan steps parse JSON session/run output and transcript evidence with `node`, which must be installed on the bed-runner host (in-pod `node` is shipped by the image's own candies).
        plan:
            - check: the built artifact advertises the generic Pi and tmux runtime capabilities and declarative terminal profiles
              id: agent-capability-labels
              exit_status: 0
              stdout:
                - contains: AGENT-CAPABILITY-LABELS-OK
              context: [runtime]
              command:
                in_container: false
                command: |
                    set -eu
                    ${CHARLY_BIN} box labels check-agent-box --format agent_provide | grep -q '"provider":"pi"'
                    ${CHARLY_BIN} box labels check-agent-box --format agent_provide | grep -q '"provider":"tmux"'
                    ${CHARLY_BIN} box labels check-agent-box --format terminal_profiles | grep -q '"claude-code"'
                    ${CHARLY_BIN} box labels check-agent-box --format terminal_profiles | grep -q '"pi"'
                    echo AGENT-CAPABILITY-LABELS-OK
            - check: two independent native Pi SDK runner processes reopen the same SessionManager file and leave no permanent runner
              id: native-pi-two-process-resume
              exit_status: 0
              stdout:
                - contains: PI-TWO-PROCESS-RESUME-OK
              context: [runtime]
              command: |
                set -eu
                DIR=$(mktemp -d "${HOME}/.pi/agent/sessions/r10.XXXXXX")
                trap 'rm -rf "$DIR"' EXIT
                FILE="$DIR/session.jsonl"
                : > "$FILE"
                FIRST=$(printf '%s\n' '{"id":"first","type":"get_state"}' | CHARLY_PI_SESSION_DIR="$DIR" CHARLY_PI_SESSION_FILE="$FILE" charly-pi-agent-runner)
                FILE1=$(printf '%s\n' "$FIRST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=s.trim().split("\n").map(JSON.parse).find(v=>v.type==="response"&&v.command==="get_state");if(!x?.success||!x.data?.sessionFile)process.exit(1);console.log(x.data.sessionFile)})')
                ID1=$(printf '%s\n' "$FIRST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=s.trim().split("\n").map(JSON.parse).find(v=>v.type==="response"&&v.command==="get_state");if(!x?.data?.sessionId)process.exit(1);console.log(x.data.sessionId)})')
                test "$FILE1" = "$FILE"
                test -s "$FILE"
                SECOND=$(printf '%s\n' '{"id":"second","type":"get_state"}' | CHARLY_PI_SESSION_DIR="$DIR" CHARLY_PI_SESSION_FILE="$FILE" charly-pi-agent-runner)
                ID2=$(printf '%s\n' "$SECOND" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=s.trim().split("\n").map(JSON.parse).find(v=>v.type==="response"&&v.command==="get_state");if(!x?.success||!x.data?.sessionId)process.exit(1);console.log(x.data.sessionId)})')
                test "$ID1" = "$ID2"
                if ps -eo comm,args | awk '$1=="node" && $0 ~ /charly-pi-agent-runner/ {found=1} END {exit found ? 0 : 1}'; then
                  echo 'native Pi runner survived its RPC stream' >&2
                  exit 1
                fi
                echo PI-TWO-PROCESS-RESUME-OK
            - check: Pi orchestrator compatibility delegates the byte stream and exact rpc-stream argv to the separately installed official CLI
              id: pi-official-orchestrator-delegation
              exit_status: 0
              stdout:
                - contains: PI-ORCHESTRATOR-DELEGATION-OK
              context: [runtime]
              command: |
                set -eu
                DIR=$(mktemp -d)
                trap 'rm -rf "$DIR"' EXIT
                printf '%s\n' '#!/bin/sh' 'test "$1" = rpc-stream' 'test "$2" = r10-instance' 'cat' > "$DIR/orchestrator"
                chmod 0755 "$DIR/orchestrator"
                OUT=$(printf '%s\n' '{"probe":"PI-ORCHESTRATOR-DELEGATION-OK"}' | PATH="$DIR:$PATH" CHARLY_PI_ORCHESTRATOR=1 CHARLY_PI_ORCHESTRATOR_INSTANCE=r10-instance charly-pi-agent-runner)
                printf '%s\n' "$OUT" | grep -q 'PI-ORCHESTRATOR-DELEGATION-OK'
                echo PI-ORCHESTRATOR-DELEGATION-OK
            - check: the actual Pi-TUI client launches detached inside the pod over the typed terminal:tmux channel
              id: pi-tui-launch
              exit_status: 0
              stdout:
                - contains: '"state":"detached"'
              context: [runtime]
              command:
                in_container: false
                command: |
                    set -eu
                    STATE=/tmp/charly-r10-pi-tui
                    rm -rf "$STATE"
                    mkdir -p "$STATE"
                    export CHARLY_AGENT_STATE_DIR="$STATE"
                    PROFILE='{"name":"pi-tui-r10","entrypoint":["charly","tui"],"cols":100,"rows":32,"env":{"CHARLY_AGENT_STATE_DIR":"/tmp/charly-r10-pi-tui-tui"},"keys":["enter","ctrl-c"],"persistence":"detach","transcript":"both"}'
                    RUN=0198f140-6b7a-7b90-8a10-aabbccddee10
                    ${CHARLY_BIN} agent terminal launch "$PROFILE" --target check-agent-pod --run-id "$RUN"
            - check: the Pi-TUI screen renders its control-plane section headers — observable readiness probed by the engine, never a fixed sleep
              id: pi-tui-rendered
              exit_status: 0
              eventually: 30s
              retry_interval: 1s
              context: [runtime]
              command:
                in_container: false
                command: |
                    set -eu
                    export CHARLY_AGENT_STATE_DIR=/tmp/charly-r10-pi-tui
                    PROFILE='{"name":"pi-tui-r10","entrypoint":["charly","tui"],"cols":100,"rows":32,"env":{"CHARLY_AGENT_STATE_DIR":"/tmp/charly-r10-pi-tui-tui"},"keys":["enter","ctrl-c"],"persistence":"detach","transcript":"both"}'
                    RUN=0198f140-6b7a-7b90-8a10-aabbccddee10
                    SCREEN=$(${CHARLY_BIN} agent terminal snapshot "$PROFILE" --target check-agent-pod --run-id "$RUN")
                    printf '%s\n' "$SCREEN" | grep -q 'Sessions / targets'
                    printf '%s\n' "$SCREEN" | grep -q 'Federated nodes'
            - check: the /help command is submitted through terminal API literal input plus the profile-allowlisted Enter key
              id: pi-tui-help-input
              exit_status: 0
              context: [runtime]
              command:
                in_container: false
                command: |
                    set -eu
                    export CHARLY_AGENT_STATE_DIR=/tmp/charly-r10-pi-tui
                    PROFILE='{"name":"pi-tui-r10","entrypoint":["charly","tui"],"cols":100,"rows":32,"env":{"CHARLY_AGENT_STATE_DIR":"/tmp/charly-r10-pi-tui-tui"},"keys":["enter","ctrl-c"],"persistence":"detach","transcript":"both"}'
                    RUN=0198f140-6b7a-7b90-8a10-aabbccddee10
                    ${CHARLY_BIN} agent terminal input "$PROFILE" '/help' --target check-agent-pod --run-id "$RUN" >/dev/null
                    ${CHARLY_BIN} agent terminal key "$PROFILE" enter --target check-agent-pod --run-id "$RUN" >/dev/null
            - check: the Pi-TUI help view renders the typed terminal command reference — observable, engine-retried
              id: pi-tui-help-rendered
              exit_status: 0
              eventually: 30s
              retry_interval: 1s
              context: [runtime]
              command:
                in_container: false
                command: |
                    set -eu
                    export CHARLY_AGENT_STATE_DIR=/tmp/charly-r10-pi-tui
                    PROFILE='{"name":"pi-tui-r10","entrypoint":["charly","tui"],"cols":100,"rows":32,"env":{"CHARLY_AGENT_STATE_DIR":"/tmp/charly-r10-pi-tui-tui"},"keys":["enter","ctrl-c"],"persistence":"detach","transcript":"both"}'
                    RUN=0198f140-6b7a-7b90-8a10-aabbccddee10
                    ${CHARLY_BIN} agent terminal snapshot "$PROFILE" --target check-agent-pod --run-id "$RUN" | grep -q '/transcript RUN'
                    ${CHARLY_BIN} agent terminal snapshot "$PROFILE" --target check-agent-pod --run-id "$RUN" | grep -q '/input PROFILE RUN TEXT'
            - check: the Pi-TUI exits through its own allowlisted ctrl-c, the reattached run records the real zero exit, durable transcript evidence carries the session, and normal completion removes the run-owned tmux server
              id: pi-tui-quit-verify
              exit_status: 0
              stdout:
                - contains: PI-TUI-LIVE-OK
              context: [runtime]
              command:
                in_container: false
                command: |
                    set -eu
                    export CHARLY_AGENT_STATE_DIR=/tmp/charly-r10-pi-tui
                    PROFILE='{"name":"pi-tui-r10","entrypoint":["charly","tui"],"cols":100,"rows":32,"env":{"CHARLY_AGENT_STATE_DIR":"/tmp/charly-r10-pi-tui-tui"},"keys":["enter","ctrl-c"],"persistence":"detach","transcript":"both"}'
                    RUN=0198f140-6b7a-7b90-8a10-aabbccddee10
                    SOCKET=charly-0198f1406b7a7b908a10aabbccddee10
                    ${CHARLY_BIN} agent terminal key "$PROFILE" ctrl-c --target check-agent-pod --run-id "$RUN" >/dev/null
                    ${CHARLY_BIN} agent terminal run "$PROFILE" --target check-agent-pod --run-id "$RUN" | grep -q '"kind":"exit"'
                    ${CHARLY_BIN} agent terminal transcript "$RUN" | grep -q 'Sessions / targets'
                    ${CHARLY_BIN} agent terminal transcript "$RUN" | grep -q '/transcript RUN'
                    if ${CHARLY_BIN} cmd check-agent-pod "tmux -L $SOCKET has-session -t run"; then
                      echo 'pi-tui run-owned tmux server survived normal completion' >&2
                      exit 1
                    fi
                    rm -rf /tmp/charly-r10-pi-tui
                    echo PI-TUI-LIVE-OK
            - check: a deployment route carries typed tmux over nested gRPC with ordered evidence, resize, detach, reattach, and verified cleanup
              id: deployment-grpc-tmux
              exit_status: 0
              stdout:
                - contains: DEPLOYMENT-GRPC-TMUX-OK
              context: [runtime]
              command:
                in_container: false
                command: |
                    set -eu
                    DIR=$(mktemp -d)
                    trap 'rm -rf "$DIR"' EXIT
                    export CHARLY_AGENT_STATE_DIR="$DIR/state"
                    PROFILE='{"name":"deployment-shell","entrypoint":["sh"],"cols":80,"rows":24,"keys":["enter"],"persistence":"detach","transcript":"both"}'
                    TARGET='{"deployment":"check-agent-pod","hops":[{"transport":"exec"},{"transport":"grpc"},{"transport":"tmux"}]}'
                    LAUNCH=$(${CHARLY_BIN} agent terminal launch "$PROFILE" --target "$TARGET")
                    printf '%s\n' "$LAUNCH" | grep -q '"state":"detached"'
                    RUN=$(printf '%s\n' "$LAUNCH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).run_id))')
                    SOCKET=charly-$(printf '%s' "$RUN" | tr -d -)
                    ${CHARLY_BIN} agent terminal resize "$PROFILE" 101 33 --target "$TARGET" --run-id "$RUN" >/dev/null
                    ${CHARLY_BIN} agent terminal input "$PROFILE" 'printf DEPLOYMENT-GRPC-TMUX-OK; exit 0' --target "$TARGET" --run-id "$RUN" >/dev/null
                    ${CHARLY_BIN} agent terminal key "$PROFILE" enter --target "$TARGET" --run-id "$RUN" >/dev/null
                    ${CHARLY_BIN} agent terminal run "$PROFILE" --target "$TARGET" --run-id "$RUN"
                    ${CHARLY_BIN} agent terminal transcript "$RUN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const text=JSON.parse(s).map(f=>(f.data?Buffer.from(f.data,"base64").toString():"")+(f.snapshot||"")).join("\n");if(!text.includes("DEPLOYMENT-GRPC-TMUX-OK"))process.exit(1)})'
                    if ${CHARLY_BIN} cmd check-agent-pod "tmux -L $SOCKET has-session -t run"; then
                      echo 'deployment tmux server survived normal completion' >&2
                      exit 1
                    fi
                    echo DEPLOYMENT-GRPC-TMUX-OK
            - check: real OpenSSH carries gRPC and tmux while a Charly candybox federates through the same auto-ported node contract
              id: ssh-grpc-tmux-and-federation
              exit_status: 0
              stdout:
                - contains: SSH-GRPC-TMUX-FEDERATION-OK
              context: [runtime]
              command:
                in_container: false
                command: |
                    set -eu
                    DIR=$(mktemp -d)
                    trap 'rm -rf "$DIR"' EXIT
                    mkdir -p "$DIR/home/.ssh"
                    ssh-keygen -q -N '' -t ed25519 -f "$DIR/home/.ssh/id_ed25519"
                    KEY=$(cat "$DIR/home/.ssh/id_ed25519.pub")
                    ${CHARLY_BIN} cmd check-agent-pod "mkdir -p /home/user/.ssh && printf '%s\n' '$KEY' > /home/user/.ssh/authorized_keys && chmod 700 /home/user/.ssh && chmod 600 /home/user/.ssh/authorized_keys"
                    export CHARLY_AGENT_STATE_DIR="$DIR/state"
                    PROFILE='{"name":"ssh-shell","entrypoint":["sh"],"cols":80,"rows":24,"keys":["enter"],"persistence":"detach","transcript":"both"}'
                    TARGET='{"hops":[{"transport":"ssh","address":"127.0.0.1","user":"user","port":${HOST_PORT:2222},"identity_file":"'$DIR'/home/.ssh/id_ed25519","options":{"IdentitiesOnly":"yes","LogLevel":"ERROR","StrictHostKeyChecking":"no","UserKnownHostsFile":"/dev/null"}},{"transport":"grpc"},{"transport":"tmux"}]}'
                    LAUNCH=$(HOME="$DIR/home" ${CHARLY_BIN} agent terminal launch "$PROFILE" --target "$TARGET")
                    printf '%s\n' "$LAUNCH" | grep -q '"state":"detached"'
                    RUN=$(printf '%s\n' "$LAUNCH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).run_id))')
                    SOCKET=charly-$(printf '%s' "$RUN" | tr -d -)
                    HOME="$DIR/home" ${CHARLY_BIN} agent terminal input "$PROFILE" 'printf SSH-GRPC-TMUX-OK; exit 0' --target "$TARGET" --run-id "$RUN" >/dev/null
                    HOME="$DIR/home" ${CHARLY_BIN} agent terminal key "$PROFILE" enter --target "$TARGET" --run-id "$RUN" >/dev/null
                    HOME="$DIR/home" ${CHARLY_BIN} agent terminal run "$PROFILE" --target "$TARGET" --run-id "$RUN"
                    ${CHARLY_BIN} agent terminal transcript "$RUN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const text=JSON.parse(s).map(f=>(f.data?Buffer.from(f.data,"base64").toString():"")+(f.snapshot||"")).join("\n");if(!text.includes("SSH-GRPC-TMUX-OK"))process.exit(1)})'
                    if ssh -i "$DIR/home/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p ${HOST_PORT:2222} user@127.0.0.1 "tmux -L $SOCKET has-session -t run"; then
                      echo 'SSH tmux server survived normal completion' >&2
                      exit 1
                    fi
                    FED_PROFILE='{"name":"federated-shell","entrypoint":["sh","-c","IFS= read -r line; printf \"FEDERATED:%s\\n\" \"$line\""],"cols":80,"rows":24,"persistence":"none","transcript":"both"}'
                    ${CHARLY_BIN} agent --state-dir "$DIR/federation" federation run "user@127.0.0.1:${HOST_PORT:2222}" tmux FEDERATION-OK --profile "$FED_PROFILE" --identity-file "$DIR/home/.ssh/id_ed25519" --ssh-option IdentitiesOnly=yes --ssh-option StrictHostKeyChecking=no --ssh-option UserKnownHostsFile=/dev/null --ssh-option LogLevel=ERROR | grep -q '"state":"settled"'
                    ${CHARLY_BIN} agent --state-dir "$DIR/federation" federation list | grep -q '"state":"settled"'
                    echo SSH-GRPC-TMUX-FEDERATION-OK
            - check: credential-synced Claude Code reaches and submits a real terminal-agent prompt, recording either completion or the authenticated provider quota boundary, and its run ID drives transcript, snapshot, and cleanup
              id: claude-code-terminal-agent-live
              exit_status: 0
              stdout:
                - contains: CLAUDE-CODE-TERMINAL-AGENT-OK
              context: [runtime]
              command:
                in_container: false
                command: |
                    set -eu
                    CLAUDE_VERSION=$(${CHARLY_BIN} cmd check-agent-pod '/usr/local/bin/claude --version' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
                    DIR=$(mktemp -d)
                    trap 'rm -rf "$DIR"' EXIT
                    export CHARLY_AGENT_STATE_DIR="$DIR/state"
                    ${CHARLY_BIN} check sync-credential check-agent-live
                    # Non-secret first-run state for the fresh disposable home: onboarding complete and /home/user trusted.
                    CLAUDE_ONBOARDING_B64=$(printf '{"hasCompletedOnboarding":true,"lastOnboardingVersion":"%s","projects":{"/home/user":{"hasTrustDialogAccepted":true,"projectOnboardingSeenCount":1,"hasCompletedProjectOnboarding":true}}}\n' "$CLAUDE_VERSION" | base64 -w0)
                    ${CHARLY_BIN} cmd check-agent-pod "printf %s $CLAUDE_ONBOARDING_B64 | base64 -d > \"\$HOME/.claude.json\""
                    PROFILE='{"name":"claude-code-r10","entrypoint":["claude"],"cols":100,"rows":32,"semantic_adapter":"claude-code","keys":["enter","ctrl-c"],"signals":["interrupt"],"persistence":"required","transcript":"both"}'
                    TARGET='{"deployment":"check-agent-pod","hops":[{"transport":"exec"},{"transport":"grpc"},{"transport":"tmux"}]}'
                    SESSION=$(${CHARLY_BIN} agent session new tmux --target "$TARGET" --profile "$PROFILE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).id))')
                    RUN_JSON=$(${CHARLY_BIN} agent run start "$SESSION" 'Reply with exactly CLAUDE-CODE-TERMINAL-AGENT-OK and nothing else.')
                    RUN=$(printf '%s\n' "$RUN_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).id))')
                    ${CHARLY_BIN} agent run show "$RUN" | grep -q '"state":"settled"'
                    TRANSCRIPT=$(${CHARLY_BIN} agent terminal transcript "$RUN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).map(f=>(f.data?Buffer.from(f.data,"base64").toString():"")+(f.snapshot||"")).join("\n")))')
                    printf '%s\n' "$TRANSCRIPT" | grep -q "Claude Code v$CLAUDE_VERSION"
                    printf '%s\n' "$TRANSCRIPT" | grep -Eq 'CLAUDE-CODE-TERMINAL-AGENT-OK|hit your weekly limit'
                    ${CHARLY_BIN} agent terminal snapshot "$PROFILE" --target "$TARGET" --run-id "$RUN" | grep -q '"cols":100'
                    ${CHARLY_BIN} agent terminal close "$PROFILE" --target "$TARGET" --run-id "$RUN" >/dev/null
                    ${CHARLY_BIN} cmd check-agent-pod 'test "$DISABLE_AUTOUPDATER" = 1 && test -x /usr/local/bin/claude && /usr/local/bin/claude --version | grep -q "Claude Code"'
                    echo CLAUDE-CODE-IMMUTABLE-INSTALL-OK
                    echo CLAUDE-CODE-TERMINAL-AGENT-OK
# Harness-only credential projection for the live Claude Code check above. The
# existing check sync-credential mechanism copies the host OAuth file into the
# disposable pod; no credential enters a config, image layer, log, or wire payload.
check-agent-live-claude:
    agent:
        description: Claude Code credential projection for check-agent-pod.
        command: [claude, -p, "${PROMPT}"]
        credential:
            - {src: ~/.claude/.credentials.json, dst: ~/.claude/.credentials.json}
check-agent-live:
    group:
        description: Credential-sync projection for the disposable agent-control R10 bed.
        iterate:
            sandbox: check-agent-pod
            agent: [check-agent-live-claude]
            plateau_iteration: 1
            prompt: Reply with one short acknowledgement so the credential-synced Claude Code session proves it can answer a real prompt inside the disposable check-agent-pod.
            note: false
            env: {}
check-arch-pacstrap-vm:
    vm:
        from: arch-pacstrap
        disposable: true
        lifecycle: dev
        description: Sole proof that the from-scratch arch-pacstrap-builder bootstrap path produces a bootable UEFI Arch rootfs VM (distinct from the cachyos-pacstrap path). The privileged arch-pacstrap-builder pacstraps an Arch rootfs (sudo/openssh/qemu-guest-agent/cloud-init/grub/efibootmgr) into a 20G ext4 UEFI q35 disk and creates the libvirt VM, then asserts boot-to-steady-state via a libvirt info domain-state running probe and an SSH boot-witness reading the guest /etc/os-release.
        plan:
            - check: libvirt=info
              id: pacstrap-libvirt-domain-running
              libvirt: info
              stdout: {contains: running}
              context: [runtime]
            - check: command=cat /etc/os-release
              id: pacstrap-guest-os-release-arch
              stdout: {contains: "ID=arch"}
              context: [runtime]
              command: "cat /etc/os-release"
check-arch-vm:
    vm:
        from: arch
        disposable: true
        lifecycle: dev
        description: Sole runnable non-GPU bed for deterministic SPICE and the 8-method libvirt-RPC probe surface, and the only bed proving add_candy overlay install and nested local-target host deploys over the external vm deploy (kit.WalkPlans over SSH) and NestedExecutor. Boots the Arch cloud-image libvirt VM (SPICE socket + virtio-gpu + qemu-guest-agent), scps the host charly binary in, overlays ripgrep/uv/pre-commit, runs ~50 guest probes (command/package/service/port/process/user/group/interface/mount/dns/addr plus spice status/screenshot plus the 8 libvirt-RPC probes plus a kernel-param sysctl assertion), and drives two nested local-target beds (tailscale runtime wiring; direnv plus the install-ledger).
        # Minimal in-guest tooling so arch-host (child) has something
        # to depend on, and so the command: probes have ripgrep/uv/
        # pre-commit versions to verify. plugin-spice is the out-of-tree
        # host-side plugin serving the `spice:` check verb: the bed's spice
        # checks are authored INLINE in the plan with no candy in the image
        # closure requiring it, so it rides in here and the host check runner
        # loads it via the deploy's add_candy (ScanAllCandyWithConfigOpts'
        # ExtraCandyRefs) — the spice analogue of how plugin-kube/plugin-adb
        # are required by k3s-server/android-emulator-layer.
        add_candy:
            - '@github.com/opencharly/charly/candy/ripgrep:v2026.201.0706'
            - '@github.com/opencharly/charly/candy/uv:v2026.201.0706'
            - '@github.com/opencharly/charly/candy/pre-commit:v2026.201.0706'
            - '@github.com/opencharly/charly/candy/plugin-spice:v2026.201.0706'
        install_opts:
            with_service: true
            allow_repo_changes: true # pacman-key + mirror tweaks
            skip_incompatible: true # skip rpm:/deb:-only layer sections
            verify: true
            # The arch VM is a cloud image (no charly builder context); name the
            # arch-builder image so the npm-building add_candy (pre-commit)
            # resolves a builder. FleetNode has no `builder:` map field —
            # install_opts.builder_image is the supported path (mirrors cachyos).
            # Use the local short-ref (arch-builder), NOT a pinned ghcr tag: a
            # full ghcr ref is checked as-is and breaks when that tag is pruned /
            # ghcr publishing is paused (manifest unknown). The short-ref routes
            # through cfg.ResolveImage → newest local arch-builder, and builds it
            # on-demand if absent (same path arch-coder's builder: map uses).
            builder_image: arch-builder
        plan:
            - check: command=id
              id: guest-identity-uid
              stdout: {contains: "uid=1000(arch)"}
              context: [runtime]
              command: id
            - check: command=id
              id: guest-identity-wheel
              stdout: {contains: wheel}
              context: [runtime]
              command: id
            - check: command=cat /etc/hostname
              id: guest-hostname-nonempty
              stdout: {matches: ".+"}
              context: [runtime]
              command: "cat /etc/hostname"
            - check: command=cat /etc/os-release
              id: guest-os-release-arch
              stdout: {contains: "ID=arch"}
              context: [runtime]
              command: "cat /etc/os-release"
            - check: command=sudo -n whoami
              id: guest-sudo-nopasswd
              stdout: {equals: root}
              context: [runtime]
              command: "sudo -n whoami"
            - check: command=uname -r
              id: guest-kernel-release
              stdout: {matches: "[0-9]+\\.[0-9]+"}
              context: [runtime]
              command: "uname -r"
            - check: command=cloud-init status --wait --long
              id: cloud-init-status-done
              stdout: {contains: "status: done"}
              context: [runtime]
              command: "cloud-init status --wait --long"
            - check: command=test -d /var/lib/cloud/instance
              id: cloud-init-instance-dir
              context: [runtime]
              command: "test -d /var/lib/cloud/instance"
            - check: command=cat /var/lib/cloud/data/result.json
              id: cloud-init-no-errors
              stdout: {contains: "\"errors\": []"}
              context: [runtime]
              command: "cat /var/lib/cloud/data/result.json"
            - check: command=systemctl is-active spice-vdagentd
              id: spice-vdagentd-active
              stdout: {equals: active}
              context: [runtime]
              command: "systemctl is-active spice-vdagentd"
            - check: command=systemctl is-enabled spice-vdagentd
              id: spice-vdagentd-enabled
              stdout: {matches: "^(enabled|static)"}
              context: [runtime]
              command: "systemctl is-enabled spice-vdagentd"
            - check: command=lsmod | grep -q virtio_gpu
              id: virtio-gpu-module
              context: [runtime]
              command: "lsmod | grep -q virtio_gpu"
            - check: command=test -e /dev/dri/card0
              id: dri-card0-present
              context: [runtime]
              command: "test -e /dev/dri/card0"
            - check: spice=status
              id: spice-status-main
              spice: status
              stdout: {contains: display}
              context: [runtime]
            - check: spice=screenshot
              id: spice-framebuffer-nonzero
              spice:
                method: screenshot
                artifact: /tmp/check-arch-vm-spice.png
                artifact_min_bytes: 1024
              context:
                - runtime
            - check: libvirt=info
              id: libvirt-domain-running
              libvirt: info
              stdout: {contains: running}
              context: [runtime]
            - check: libvirt=domain-xml
              id: libvirt-domain-xml-q35
              libvirt: "domain-xml"
              stdout: {contains: q35}
              context: [runtime]
            - check: libvirt=domain-xml
              id: libvirt-domain-xml-virtio
              libvirt: "domain-xml"
              stdout: {contains: "type='virtio'"}
              context: [runtime]
            - check: libvirt=qmp
              id: libvirt-qmp-query-status
              libvirt:
                method: qmp
                text: query-status
              stdout: {contains: running}
              context: [runtime]
            - check: libvirt=guest/ping
              id: libvirt-guest-agent-ping
              libvirt: "guest/ping"
              stderr: {contains: responsive}
              context: [runtime]
            - check: libvirt=guest/hostname
              id: libvirt-guest-hostname
              libvirt: "guest/hostname"
              stdout: {matches: ".+"}
              context: [runtime]
            - check: libvirt=guest/os-info
              id: libvirt-guest-os-info
              libvirt: "guest/os-info"
              stdout: {contains: arch}
              context: [runtime]
            - check: libvirt=guest/interfaces
              id: libvirt-guest-interfaces
              libvirt: "guest/interfaces"
              stdout: {contains: lo}
              context: [runtime]
            - check: command=pacman-key --list-keys arch 2>&1 | grep -q pub
              id: pacman-key-populated
              context: [runtime]
              command: "pacman-key --list-keys arch 2>&1 | grep -q pub"
            - check: command=sudo pacman -Sy --noconfirm
              id: pacman-repos-reachable
              context: [runtime]
              command: "sudo pacman -Sy --noconfirm"
            - check: command=test -f /home/arch/.ssh/authorized_keys
              id: ssh-authorized-keys
              context: [runtime]
              command: "test -f /home/arch/.ssh/authorized_keys"
            - check: command=grep -c ssh-ed25519 /home/arch/.ssh/authorized_keys
              id: ssh-ed25519-key-count
              stdout: {matches: "[1-9]"}
              context: [runtime]
              command: "grep -c ssh-ed25519 /home/arch/.ssh/authorized_keys"
            - check: command=nproc
              id: cpu-count-4
              stdout: {matches: "^4"}
              context: [runtime]
              command: nproc
            - check: command=awk '/MemTotal/ {print int($2/1024/1024)}' /proc/meminfo
              id: mem-8g-ballpark
              stdout: {matches: "^[78]"}
              context: [runtime]
              command: "awk '/MemTotal/ {print int($2/1024/1024)}' /proc/meminfo"
            - check: command=df -BG / | awk 'NR==2 {gsub("G","",$2); print int($2)}'
              id: disk-ballpark
              stdout: {matches: "^([1-9][0-9]|[1-9][0-9][0-9])"}
              context: [runtime]
              command: "df -BG / | awk 'NR==2 {gsub(\"G\",\"\",$2); print int($2)}'"
            - check: command=rg --version
              id: ripgrep-version
              stdout: {contains: ripgrep}
              context: [runtime]
              command: "rg --version"
            - check: command=uv --version
              id: uv-version
              stdout: {contains: "uv "}
              context: [runtime]
              command: "uv --version"
            - check: command=pre-commit --version
              id: pre-commit-version
              stdout: {contains: pre-commit}
              context: [runtime]
              command: "pre-commit --version"
            - check: command=command -v rg uv pre-commit
              id: tooling-on-path
              context: [runtime]
              command: "command -v rg uv pre-commit"
            - check: package=base-devel
              id: pkg-base-devel-present
              context: [runtime]
              package:
                package: base-devel
                installed: true
            - check: package=git
              id: pkg-git-present
              context: [runtime]
              package:
                package: git
                installed: true
            - check: service=spice-vdagentd
              id: svc-spice-vdagentd-running
              context: [runtime]
              service:
                service: spice-vdagentd
                running: true
            - check: service=sshd
              id: svc-sshd-running
              context: [runtime]
              service:
                service: sshd
                running: true
            - check: port=22
              id: port-22-listening
              context: [runtime]
              port:
                port: 22
                listening: true
            - check: process=sshd
              id: proc-sshd-running
              context: [runtime]
              process:
                process: sshd
                running: true
            - check: user=arch
              id: user-arch-present
              context: [runtime]
              user:
                user: arch
