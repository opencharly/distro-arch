    charly-cachyos-tailscale-test:
        local:
            disposable: true
            lifecycle: dev
            description: R10 bed for tailscale + tailscale-up runtime wiring
            add_candy:
                - '@github.com/opencharly/layer-tailscale:v2026.240.0121'
                - '@github.com/opencharly/layer-tailscale-up:v2026.243.0410'
