              context: [runtime]
              command: "df -BG / | awk 'NR==2 {gsub(\"G\",\"\",$2); print int($2)}'"
            - check: command=rg --version
              id: ripgrep-version
              stdout: {contains: ripgrep}
              context: [runtime]
              command: "rg --version"
            - check: command=uv --version
              id: uv-version
              stdout: {contains: "uv "}
              context: [runtime]
              command: "uv --version"
            - check: command=pre-commit --version
              id: pre-commit-version
              stdout: {contains: pre-commit}
              context: [runtime]
              command: "pre-commit --version"
            - check: command=command -v rg uv pre-commit
              id: tooling-on-path
