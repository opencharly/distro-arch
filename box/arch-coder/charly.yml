arch-coder:
    candy:
        # base: the local `arch` base (owned by this submodule); distro:/build:
        # inherit from it.
        base: arch
        # Explicit builder map: arch-coder compiles pixi (pixi/uv), npm (nodejs),
        # and cargo (rust) multi-stage layers — each format routes to the local
        # arch-builder.
        builder:
            aur: arch-builder
            cargo: arch-builder
            npm: arch-builder
            pixi: arch-builder
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.238.1851'
            - '@github.com/opencharly/pod-sshd:v2026.237.558'
            - '@github.com/opencharly/charly/candy/charly:v2026.231.0530'
            - '@github.com/opencharly/charly/candy/charly-mcp:v2026.231.0530'
            - '@github.com/opencharly/layer-container-nesting:v2026.237.938'
            - '@github.com/opencharly/pod-dbus:v2026.235.2115'
            - '@github.com/opencharly/layer-tmux:v2026.235.2057'
            - '@github.com/opencharly/layer-language-runtimes:v2026.238.2140'
            - '@github.com/opencharly/layer-golang:v2026.235.2057'
            - '@github.com/opencharly/layer-nodejs:v2026.235.2056'
            - '@github.com/opencharly/layer-rust:v2026.237.458'
            - '@github.com/opencharly/layer-pixi:v2026.237.457'
            - '@github.com/opencharly/layer-uv:v2026.237.458'
            - '@github.com/opencharly/layer-build-toolchain:v2026.237.455'
            - '@github.com/opencharly/layer-dev-tools:v2026.237.502'
            - '@github.com/opencharly/layer-pre-commit:v2026.237.557'
            - '@github.com/opencharly/layer-direnv:v2026.237.504'
            - '@github.com/opencharly/layer-gh:v2026.237.456'
            - '@github.com/opencharly/layer-typst:v2026.237.458'
            - '@github.com/opencharly/layer-asciinema:v2026.238.2226'
            - '@github.com/opencharly/layer-claude-code:v2026.237.456'
            - '@github.com/opencharly/layer-codex:v2026.237.556'
            - '@github.com/opencharly/layer-gemini:v2026.235.2110'
            - '@github.com/opencharly/layer-forgecode:v2026.237.556'
            - '@github.com/opencharly/layer-oracle:v2026.237.557'
            - '@github.com/opencharly/layer-devops-tools:v2026.237.556'
            - '@github.com/opencharly/layer-kubernetes:v2026.237.457'
            - '@github.com/opencharly/layer-docker-ce:v2026.237.456'
            - '@github.com/opencharly/layer-github-actions:v2026.237.457'
            - '@github.com/opencharly/layer-google-cloud:v2026.237.457'
            - '@github.com/opencharly/layer-google-cloud-npm:v2026.238.2102'
            - '@github.com/opencharly/layer-grafana-tools:v2026.237.457'
        # No box-level check: every CLI / language / devops binary, the sshd +
        # charly-mcp ports, AND `charly version` belong to their providing candy's
        # baked check (claude-code/codex/gemini/forgecode, golang/nodejs/rust,
        # kubernetes/docker-ce/devops-tools/google-cloud, sshd, charly-mcp, charly),
        # so ONE candy check covers every coder box composing them.
