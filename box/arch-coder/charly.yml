arch-coder:
    candy:
        # base: the local `arch` base (owned by this submodule); distro:/build:
        # inherit from it.
        base: arch
        # Explicit builder map: arch-coder compiles pixi (pixi/uv), npm (nodejs),
        # and cargo (rust) multi-stage layers — each format routes to the local
        # arch-builder.
        builder:
            aur: arch-builder
            cargo: arch-builder
            npm: arch-builder
            pixi: arch-builder
        candy:
            # ONE SOURCE per layer (opencharly/charly#739, operator ruling): the composed
            # meta-layer already provides the other half of each {pod, layer} pair, so
            # the box keeps exactly ONE ref per candy. The 6 direct refs dropped here and
            # the composed ref that provides each — all at the SAME tag the box listed,
            # so the closure is unchanged (no downgrade):
            #   layer-charly       <- pod-charly-mcp:v2026.243.0516
            #   layer-nodejs       <- layer-language-runtimes:v2026.243.0409
            #   layer-rust         <- layer-language-runtimes:v2026.243.0409
            #   layer-direnv       <- layer-agent-forwarding:v2026.243.0408
            #   layer-gemini       <- layer-google-cloud-npm:v2026.243.0515
            #   layer-google-cloud <- layer-google-cloud-npm:v2026.243.0515
            # MEASURED (charly box inspect arch-coder, origin/main vs head): the resolved
            # candy set is unchanged (26 entries both sides); each dropped ref is composed
            # at the SAME tag by the provider listed above (verified over the repo cache),
            # so the closure is byte-identical and no pin needs advancing.
            - '@github.com/opencharly/layer-agent-forwarding:v2026.271.1839'
            - '@github.com/opencharly/pod-sshd:v2026.272.0324'
            - '@github.com/opencharly/pod-charly-mcp:v2026.274.0406'
            - '@github.com/opencharly/layer-container-nesting:v2026.271.2309'
            - '@github.com/opencharly/pod-dbus:v2026.272.0105'
            - '@github.com/opencharly/layer-tmux:v2026.272.0425'
            - '@github.com/opencharly/layer-language-runtimes:v2026.273.1816'
            - '@github.com/opencharly/layer-golang:v2026.272.0137'
            - '@github.com/opencharly/layer-pixi:v2026.272.0440'
            - '@github.com/opencharly/layer-uv:v2026.272.0409'
            - '@github.com/opencharly/layer-build-toolchain:v2026.271.1840'
            - '@github.com/opencharly/layer-dev-tools:v2026.272.0100'
            - '@github.com/opencharly/layer-pre-commit:v2026.272.0509'
            - '@github.com/opencharly/layer-gh:v2026.272.0136'
            - '@github.com/opencharly/layer-typst:v2026.272.0407'
            - '@github.com/opencharly/layer-asciinema:v2026.273.1825'
            - '@github.com/opencharly/layer-claude-code:v2026.271.2310'
            - '@github.com/opencharly/layer-codex:v2026.271.2317'
            - '@github.com/opencharly/layer-forgecode:v2026.272.0221'
            - '@github.com/opencharly/layer-oracle:v2026.272.0437'
            - '@github.com/opencharly/layer-devops-tools:v2026.272.0057'
            - '@github.com/opencharly/layer-kubernetes:v2026.272.0319'
            - '@github.com/opencharly/layer-docker-ce:v2026.272.0100'
            - '@github.com/opencharly/layer-github-actions:v2026.272.0135'
            - '@github.com/opencharly/layer-google-cloud-npm:v2026.273.1835'
            - '@github.com/opencharly/layer-grafana-tools:v2026.272.0139'
        # No box-level check: every CLI / language / devops binary, the sshd +
        # charly-mcp ports, AND `charly version` belong to their providing candy's
        # baked check (claude-code/codex/gemini/forgecode, golang/nodejs/rust,
        # kubernetes/docker-ce/devops-tools/google-cloud, sshd, charly-mcp, charly),
        # so ONE candy check covers every coder box composing them.
