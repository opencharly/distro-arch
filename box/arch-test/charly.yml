arch-test:
    candy:
        base: arch
        build:
            - pac
        # Explicit builder map: arch-test composes an AUR candy (arch-aur-test, which
        # declares its package under distro.arch.aur), so the aur builder routes to the
        # local arch-builder. aur is a builder, never a box build format.
        builder:
            aur: arch-builder
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.314.0704'
            - arch-pac-test
            - arch-aur-test
            - arch-skills
