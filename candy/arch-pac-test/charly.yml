arch-pac-test:
    candy:
        version: 2026.144.1443
        description: |
            pacman repo install smoke test — installs neovim and ripgrep
            Minimal candy that exercises the Arch pacman repo install path by
            installing neovim and ripgrep. Verifiable: both binaries (nvim, rg)
            land on PATH and the packages are registered.
        distro:
            arch:
                package:
                    - neovim
                    - ripgrep
        plan:
            - check: the neovim editor binary is installed at /usr/bin/nvim
              file:
                file: /usr/bin/nvim
                exists: true
            - check: the ripgrep binary is installed at /usr/bin/rg
              file:
                file: /usr/bin/rg
                exists: true
            - check: file=/usr/bin/nvim
              id: nvim-binary
              file:
                file: /usr/bin/nvim
                exists: true
            - check: package=neovim
              id: nvim-package
              package:
                package: neovim
                installed: true
            - check: file=/usr/bin/rg
              id: rg-binary
              file:
                file: /usr/bin/rg
                exists: true
            - check: package=ripgrep
              id: ripgrep-package
              package:
                package: ripgrep
                installed: true
