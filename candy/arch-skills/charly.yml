#  opencharly/distro-arch — the skill-prose bundle for the Arch image family.
#
#  WHY THIS CANDY EXISTS (opencharly/sdk#434, operator ruling): a `skill:` node's `owner:` must
#  name a CANDY. An image — a `candy:` node carrying `base:`/`from:` — has no source directory: the
#  loader folds it into the image set and never the layer set, so an image-owned skill's prose can
#  never be read AND the node is silently absent from the `ai.opencharly.skill` OCI label.
#  The five `skill:` nodes below were all owned by an image; this candy owns them instead, and their
#  bodies live beside this manifest under `.agents/skills/<name>/SKILL.md` (the Agent-Skills
#  standard tree) — the one place the marketplace/docs generators and the label projection read.
#
#  THE CANDY CARRIES THE PROSE INTO THE IMAGE: composed into every image that carries one of these
#  skills, it installs the tree at the uid-1000 account's `~/.agents/skills` — the location a
#  harness running inside the image reads — and its ADE `check:` proves the install landed.
arch-skills:
    candy:
        description: |
            Skill-prose bundle for the Arch image family: owns the `arch`, `arch-builder`,
            `arch-coder`, `arch-test` and `charly-arch` `skill:` entities (sibling nodes in this
            file) and carries their bodies under .agents/skills/<name>/SKILL.md.
            It exists because a `skill:` node's owner must be a candy, not an image — an image has
            no source directory, so an image-owned node's prose is unreadable and the skill is
            absent from the ai.opencharly.skill OCI label (opencharly/sdk#434).
            Composed into every image that carries one of those skills; installs the tree at the
            uid-1000 account's ~/.agents/skills so a harness in the image reads the same prose the
            label carries.
        plan:
            - run: install the skill tree at the uid-1000 account's Agent-Skills location
              id: install-skill-tree
              copy: .agents/skills
              to: "${HOME}/.agents/skills"
              run_as: "${USER}"
              comment: the bodies the ai.opencharly.skill label projects, made readable in-image
            - check: every skill body this candy carries is installed under the uid-1000 account's ~/.agents/skills
              id: skill-bodies-installed
              context:
                - build
              exit_status: 0
              command: |
                  set -eu
                  H="$(awk -F: '$3 == 1000 { print $6 }' /etc/passwd)"
                  test -n "$H"
                  for s in arch arch-builder arch-coder arch-test charly-arch; do
                      test -s "$H/.agents/skills/$s/SKILL.md"
                  done
arch-builder-skill:
    skill:
        name: arch-builder
        family: distros
        owner: arch-skills
        description: |-
            Arch Linux builder image with pixi, Node.js, build toolchain, and yay AUR helper.
            Default builder for pixi, npm, cargo, and aur multi-stage builds on Arch.
            MUST be invoked before building, deploying, configuring, or troubleshooting the arch-builder box.
arch-test-skill:
    skill:
        name: arch-test
        family: distros
        owner: arch-skills
        description: |-
            Test box for Arch Linux pacman and AUR package installation.
            MUST be invoked before building or troubleshooting the arch-test box.
arch-skill:
    skill:
        name: arch
        family: distros
        owner: arch-skills
        description: |-
            Base Arch Linux image. Root of the box hierarchy for all pac-based boxes.
            MUST be invoked before building, deploying, configuring, or troubleshooting the arch box.
arch-coder-skill:
    skill:
        name: arch-coder
        family: coder
        owner: arch-skills
        description: |-
            Kitchen-sink development box on Arch Linux: coding + AI-coding CLIs +
            DevOps tooling in one container. Arch base, 26 direct candies mirroring
            fedora-coder's stack but with pac:-section packages (plus AUR for a few
            unique cases). Runs as uid 1000 (`user`) with passwordless sudo.
            Use when working with the arch-coder box — or when comparing
            cross-distro parity across the four coder-family boxes (fedora,
            debian, ubuntu, arch).
charly-arch-skill:
    skill:
        name: charly-arch
        family: coder
        owner: arch-skills
        description: |-
            Arch Linux box with the full charly toolchain. Rootless-first — runs as
            uid=1000 with passwordless sudo (no root, no cap_add: ALL).
            Composes /charly-coder:charly-mcp so the box is reachable as an MCP gateway
            on port 18765. NVIDIA GPU runtime composed in.
            MUST be invoked before building, deploying, configuring, or troubleshooting
            the charly-arch box.
